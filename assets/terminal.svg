<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Ghotet animated terminal profile</title>
  <desc id="desc">A cyberpunk terminal boot sequence introducing Jay as an AI Systems Designer building Daemonic.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f12"/>
      <stop offset="1" stop-color="#10131a"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c1"><rect x="0" y="0" width="0" height="24"><animate attributeName="width" from="0" to="790" dur="0.7s" begin="0.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="0" y="0" width="0" height="24"><animate attributeName="width" from="0" to="790" dur="0.65s" begin="1.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="0" y="0" width="0" height="24"><animate attributeName="width" from="0" to="790" dur="0.65s" begin="1.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="0" y="0" width="0" height="24"><animate attributeName="width" from="0" to="790" dur="0.65s" begin="2.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="0" y="0" width="0" height="24"><animate attributeName="width" from="0" to="790" dur="0.75s" begin="3.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="0" y="0" width="0" height="24"><animate attributeName="width" from="0" to="790" dur="0.55s" begin="4.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="c7"><rect x="0" y="0" width="0" height="24"><animate attributeName="width" from="0" to="790" dur="0.65s" begin="4.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c8"><rect x="0" y="0" width="0" height="24"><animate attributeName="width" from="0" to="790" dur="0.55s" begin="5.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c9"><rect x="0" y="0" width="0" height="24"><animate attributeName="width" from="0" to="790" dur="0.9s" begin="6.2s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="6" y="6" width="888" height="418" rx="16" fill="url(#shell)" stroke="#2a3038" stroke-width="2"/>
  <rect x="6" y="6" width="888" height="42" rx="16" fill="#151a21"/>
  <rect x="6" y="33" width="888" height="15" fill="#151a21"/>
  <circle cx="30" cy="27" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="27" r="6" fill="#febc2e"/>
  <circle cx="70" cy="27" r="6" fill="#28c840"/>
  <text x="450" y="32" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="14" fill="#8b949e">ghotet@github : ~</text>

  <g transform="translate(42 76)" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="19">
    <text y="0" fill="#d7dde5" clip-path="url(#c1)"><tspan fill="#d946ef">ghotet@github</tspan><tspan fill="#6b7280">:</tspan><tspan fill="#22c55e">~</tspan><tspan fill="#d7dde5">$ ./profile --boot</tspan></text>

    <text y="38" fill="#22c55e" clip-path="url(#c2)">[ OK ] loading game-design brain</text>
    <text y="70" fill="#22c55e" clip-path="url(#c3)">[ OK ] connecting AI coworkers</text>
    <text y="102" fill="#22c55e" clip-path="url(#c4)">[ OK ] local models detected</text>
    <text y="134" fill="#f59e0b" clip-path="url(#c5)">[WARN] reasonable project scope not found</text>

    <text y="186" fill="#d7dde5" clip-path="url(#c6)"><tspan fill="#d946ef">&gt;</tspan> whoami</text>
    <text y="218" fill="#7dd3fc" font-weight="700" clip-path="url(#c7)">Jay // AI Systems Designer</text>

    <text y="270" fill="#d7dde5" clip-path="url(#c8)"><tspan fill="#d946ef">&gt;</tspan> current_project</text>
    <text y="302" fill="#c084fc" font-weight="700" clip-path="url(#c9)">Daemonic // local-first AI ecosystem</text>

    <g transform="translate(0 350)">
      <text y="0" fill="#8b949e">build weird shit and see what happens</text>
      <rect x="402" y="-17" width="10" height="21" rx="1" fill="#22c55e" filter="url(#softGlow)">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
