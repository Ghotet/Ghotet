      <path d="M492 112 C481 101 467 99 456 104 C459 122 468 134 484 137 C490 129 493 121 492 112 Z"/>
      <animate attributeName="opacity" values="1;1;0;1;1;1;0;1" keyTimes="0;0.44;0.455;0.475;0.79;0.805;0.825;1" dur="6.6s" repeatCount="indefinite"/>
    </g>

