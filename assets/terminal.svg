<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-labelledby="title desc">
  <title id="title">Ghotet animated hooded mascot</title>
  <desc id="desc">A neon-green hooded figure with a dark alien mask quietly types on a laptop between terminal screens.</desc>

  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#0b2a18" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#09150f" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hoodGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18ff68"/>
      <stop offset="0.45" stop-color="#00e84f"/>
      <stop offset="1" stop-color="#009b38"/>
    </linearGradient>
    <linearGradient id="hoodShadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06c847"/>
      <stop offset="1" stop-color="#005c28"/>
    </linearGradient>
    <linearGradient id="laptop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#05090c"/>
    </linearGradient>
    <filter id="greenGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="5" y="5" width="890" height="280" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <ellipse cx="450" cy="145" rx="335" ry="132" fill="url(#bgGlow)"/>

  <g opacity="0.42" stroke="#00c948" fill="none" stroke-width="1.3">
    <rect x="112" y="55" width="188" height="116" rx="8"/>
    <rect x="600" y="55" width="188" height="116" rx="8"/>
    <path d="M128 74 H192 M128 88 H242 M128 102 H219 M128 116 H274 M128 130 H206 M128 144 H256"/>
    <path d="M616 74 H692 M616 88 H758 M616 102 H714 M616 116 H770 M616 130 H734 M616 144 H682"/>
  </g>
  <g opacity="0.72" fill="#00f04a">
    <circle cx="128" cy="74" r="2.2"/><circle cx="616" cy="74" r="2.2"/>
    <rect x="247" y="99" width="18" height="2"/><rect x="716" y="129" width="26" height="2"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0;0 0" keyTimes="0;0.22;0.44;1" dur="4.8s" repeatCount="indefinite"/>

    <path d="M350 203 C365 178 392 164 421 159 L479 159 C509 164 536 179 550 203 L566 261 H334 Z"
