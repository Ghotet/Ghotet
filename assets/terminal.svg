<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Ghotet hooded ASCII mascot</title>
  <desc id="desc">A green hooded ASCII-inspired mascot with a dark alien mask types at a laptop beside Jay's profile information.</desc>

  <rect x="5" y="5" width="890" height="290" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- ASCII-inspired green hoodie -->
  <g font-family="Consolas, Monaco, 'Courier New', monospace" font-size="18" fill="#55c96f" xml:space="preserve">
    <text x="58" y="48">            .-~~~~~~~~~-.</text>
    <text x="58" y="70">         .-' /+++++++++\ '-.</text>
    <text x="58" y="92">       .'   /+++++++++++\   '.</text>
    <text x="58" y="114">      /    /+++++   +++++\    \</text>
    <text x="58" y="136">     |    |++++       ++++|    |</text>
    <text x="58" y="158">     |    |++++       ++++|    |</text>
    <text x="58" y="180">      \    \+++++   +++++/    /</text>
    <text x="58" y="202">       '._   '+++++++'   _.'</text>
    <text x="58" y="224">          '---._____.---'</text>
  </g>

  <!-- Dark mask under the hood -->
  <path d="M184 105 C196 90 216 84 237 84 C258 84 278 90 290 105 C291 132 281 155 237 175 C193 155 183 132 184 105 Z"
        fill="#11161c" stroke="#7d8590" stroke-width="2"/>

  <!-- Alienware-ish face: normal -->
  <g>
    <path d="M198 113 Q214 103 227 112 Q220 132 204 136 Q199 127 198 113 Z" fill="#d8dee4"/>
    <path d="M276 113 Q260 103 247 112 Q254 132 270 136 Q275 127 276 113 Z" fill="#d8dee4"/>
    <path d="M227 150 Q237 157 247 150" fill="none" stroke="#7d8590" stroke-width="2" stroke-linecap="round"/>
    <animate attributeName="opacity" values="1;1;0;1;1;1;0;1" keyTimes="0;0.40;0.42;0.45;0.82;0.84;0.86;1" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- Blink -->
  <g opacity="0" stroke="#d8dee4" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M201 124 Q213 128 224 124"/>
    <path d="M273 124 Q261 128 250 124"/>
    <animate attributeName="opacity" values="0;0;1;0;0;0;1;0" keyTimes="0;0.40;0.42;0.45;0.82;0.84;0.86;1" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- Hoodie shoulders -->
  <g font-family="Consolas, Monaco, 'Courier New', monospace" font-size="18" fill="#3fa65a" xml:space="preserve">
    <text x="87" y="242">       __/+++++++++++++++\__</text>
    <text x="87" y="264">  ____/+++++++++++++++++++++\____</text>
  </g>

  <!-- Laptop -->
  <g font-family="Consolas, Monaco, 'Courier New', monospace" font-size="16" xml:space="preserve">
    <text x="71" y="252" fill="#8b949e">  __________________________</text>
    <text x="71" y="270" fill="#8b949e"> /  &gt; daemonic --wake      \</text>
    <text x="71" y="288" fill="#8b949e">/____________________________\</text>
    <rect x="278" y="257" width="8" height="15" fill="#55c96f">
      <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Typing hands -->
  <g font-family="Consolas, Monaco, 'Courier New', monospace" font-size="18" fill="#d8dee4">
    <text x="175" y="248">__/</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 3;0 0;0 0" keyTimes="0;0.25;0.5;1" dur="0.7s" repeatCount="indefinite"/>
  </g>
  <g font-family="Consolas, Monaco, 'Courier New', monospace" font-size="18" fill="#d8dee4">
    <text x="239" y="248">\__</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 3;0 0" keyTimes="0;0.35;0.65;1" dur="0.7s" repeatCount="indefinite"/>
  </g>

  <!-- Profile text -->
  <g font-family="Consolas, Monaco, 'Courier New', monospace">
    <text x="430" y="67" fill="#55c96f" font-size="15" letter-spacing="3">GHOTET // PROFILE</text>
    <text x="430" y="111" fill="#f0f3f6" font-size="31" font-weight="700">Jay</text>
    <text x="430" y="143" fill="#8fd99f" font-size="20">AI Systems Designer</text>

    <text x="430" y="190" fill="#8b949e" font-size="15">&gt; current_project</text>
    <text x="430" y="218" fill="#f0f3f6" font-size="19">Daemonic</text>

    <text x="430" y="252" fill="#8b949e" font-size="15">&gt; operating_mode</text>
    <text x="430" y="278" fill="#d8dee4" font-size="17">design systems // break things // iterate</text>
  </g>
</svg>
