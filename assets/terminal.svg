    <g fill="none" stroke="#0af05a" stroke-width="6" stroke-linecap="round">
      <path d="M405 246 Q417 236 431 247">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 3;0 0;0 0" keyTimes="0;0.25;0.5;1" dur="0.62s" repeatCount="indefinite"/>
