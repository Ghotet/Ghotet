<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Ghotet animated hoodie mascot</title>
  <desc id="desc">A hooded ASCII-inspired mascot with an alien mask types at a laptop beside Jay's profile title.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#303946"/>
      <stop offset="1" stop-color="#1b232d"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141b23"/>
      <stop offset="1" stop-color="#0a0f14"/>
    </linearGradient>
  </defs>

  <rect x="5" y="5" width="890" height="320" rx="18" fill="url(#panel)" stroke="#30363d" stroke-width="2"/>

  <!-- ASCII-ish scan marks behind the mascot -->
  <g fill="#31485b" opacity="0.42" font-family="Consolas, Monaco, monospace" font-size="14">
    <text x="44" y="66">..::----..</text>
    <text x="31" y="92">---....------</text>
    <text x="54" y="118">..:::::....</text>
    <text x="38" y="144">------..::---</text>
    <text x="67" y="170">..::....::..</text>
    <text x="42" y="196">----::::----</text>
  </g>

  <!-- Hoodie -->
  <path d="M171 42 C126 48 98 86 93 129 C89 166 102 195 127 217 L119 250 L294 250 L285 216 C312 190 322 157 315 121 C307 78 275 48 231 42 Z"
        fill="url(#hood)" stroke="#5a7085" stroke-width="3"/>
  <path d="M178 56 C143 65 119 96 117 132 C115 166 132 194 160 207 C180 216 229 216 250 206 C281 191 296 162 291 126 C286 90 263 65 229 56 Z"
        fill="#0b0f14" stroke="#647b91" stroke-width="3"/>

  <!-- Hood seams / ASCII accents -->
  <g stroke="#4d6479" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <path d="M143 72 L128 88 M126 101 L115 119 M286 87 L298 104 M300 118 L307 138"/>
    <path d="M115 204 L132 213 M281 207 L296 198"/>
  </g>
  <g fill="#7a91a5" font-family="Consolas, Monaco, monospace" font-size="14" opacity="0.75">
    <text x="110" y="82">//</text><text x="290" y="97">\\</text>
    <text x="106" y="190">::</text><text x="294" y="181">::</text>
  </g>

  <!-- Alienware-ish mask -->
  <path d="M175 116 C185 99 205 91 222 91 C240 91 259 99 269 116 C270 148 258 173 222 190 C186 173 174 148 175 116 Z"
        fill="#0c1218" stroke="#8aa1b7" stroke-width="2.6"/>
  <path d="M189 117 C199 108 209 104 219 103 M255 117 C245 108 235 104 225 103"
        fill="none" stroke="#718aa0" stroke-width="2" stroke-linecap="round"/>

  <!-- Normal alien eyes -->
  <g>
    <path d="M191 126 Q204 117 216 126 Q209 143 196 146 Q192 138 191 126 Z" fill="#63b8d6"/>
    <path d="M253 126 Q240 117 228 126 Q235 143 248 146 Q252 138 253 126 Z" fill="#63b8d6"/>
    <animate attributeName="opacity" values="1;1;0;1;1;1;0;1" keyTimes="0;0.44;0.455;0.475;0.82;0.835;0.85;1" dur="6.8s" repeatCount="indefinite"/>
  </g>

  <!-- Blink eyes -->
  <g opacity="0">
    <path d="M193 135 Q204 139 215 135" fill="none" stroke="#63b8d6" stroke-width="3" stroke-linecap="round"/>
    <path d="M251 135 Q240 139 229 135" fill="none" stroke="#63b8d6" stroke-width="3" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0;0;1;0;0;0;1;0" keyTimes="0;0.44;0.455;0.475;0.82;0.835;0.85;1" dur="6.8s" repeatCount="indefinite"/>
  </g>
  <path d="M216 160 Q222 165 228 160" fill="none" stroke="#566f84" stroke-width="2" stroke-linecap="round"/>

  <!-- Torso -->
  <path d="M139 207 C158 194 177 190 194 190 L250 190 C268 190 286 195 302 208 L315 273 L126 273 Z"
        fill="#232c36" stroke="#4f6579" stroke-width="2.5"/>
  <path d="M183 194 L222 219 L261 194" fill="none" stroke="#465a6c" stroke-width="2.4"/>
  <path d="M215 217 L222 226 L229 217" fill="none" stroke="#63b8d6" stroke-width="2"/>

  <!-- Laptop -->
  <g>
    <path d="M91 190 L182 190 L194 256 L80 256 Z" fill="url(#screen)" stroke="#667d92" stroke-width="3"/>
    <path d="M80 256 L260 256 L248 273 L65 273 Z" fill="#222c36" stroke="#667d92" stroke-width="2"/>
    <g stroke="#4c6478" stroke-width="2" opacity="0.8">
      <path d="M106 211 H163"/><path d="M104 222 H151"/><path d="M102 233 H159"/>
    </g>
    <path d="M126 217 L133 224 L126 231 M147 231 L156 217" fill="none" stroke="#63b8d6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typing hands -->
  <g>
    <g transform="translate(158 243)">
      <path d="M0 0 Q9 -11 18 -1 L29 8" fill="none" stroke="#8298aa" stroke-width="5" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" values="158 243;158 247;158 243;158 243" keyTimes="0;0.24;0.5;1" dur="0.7s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(213 246)">
      <path d="M0 7 L12 -2 Q20 -10 27 1" fill="none" stroke="#8298aa" stroke-width="5" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" values="213 246;213 246;213 242;213 246" keyTimes="0;0.35;0.65;1" dur="0.7s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Tiny key sparks -->
  <g fill="#63b8d6" font-family="Consolas, Monaco, monospace" font-size="12">
    <text x="176" y="268">.</text><text x="207" y="266">:</text><text x="231" y="269">.</text>
  </g>

  <!-- Profile copy -->
  <g font-family="Consolas, Monaco, 'Courier New', monospace">
    <text x="392" y="74" fill="#8b9daf" font-size="15" letter-spacing="3">GHOTET // PROFILE</text>
    <text x="392" y="116" fill="#e6edf3" font-size="29" font-weight="700">Jay</text>
    <text x="392" y="148" fill="#63b8d6" font-size="20">AI Systems Designer</text>

    <text x="392" y="199" fill="#7d8c9a" font-size="15">&gt; methodology</text>
    <text x="392" y="226" fill="#d7dee5" font-size="18">I don't code, I delegate.</text>

    <text x="392" y="266" fill="#7d8c9a" font-size="15">&gt; current</text>
    <text x="392" y="293" fill="#d7dee5" font-size="18">Daemonic</text>
    <rect x="487" y="277" width="10" height="20" rx="1" fill="#63b8d6">
      <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
