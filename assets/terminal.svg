  <g fill="#18ff68" opacity="0.65">
    <rect x="153" y="150" width="7" height="3">
      <animate attributeName="opacity" values="0.15;0.8;0.25;0.15" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="735" y="103" width="11" height="3">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.7s" repeatCount="indefinite"/>
    </rect>
