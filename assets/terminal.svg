    <path d="M415 166 L450 191 L485 166" fill="none" stroke="#062f18" stroke-width="4" opacity="0.7"/>

    <path d="M450 25 C385 25 343 65 339 122 C336 164 355 193 385 208 C376 182 371 155 373 126 C376 78 407 49 450 48 C493 49 524 78 527 126 C529 155 524 182 515 208 C545 193 564 164 561 122 C557 65 515 25 450 25 Z"
