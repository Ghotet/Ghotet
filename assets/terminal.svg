      <path d="M410 120 Q426 127 441 120"/>
      <path d="M490 120 Q474 127 459 120"/>
      <animate attributeName="opacity" values="0;0;1;0;0;0;1;0" keyTimes="0;0.44;0.455;0.475;0.79;0.805;0.825;1" dur="6.6s" repeatCount="indefinite"/>
    </g>

    <path d="M441 155 Q450 160 459 155" fill="none" stroke="#008f35" stroke-width="2" stroke-linecap="round"/>

    <path d="M382 197 C398 205 409 219 414 241" fill="none" stroke="#00b941" stroke-width="17" stroke-linecap="round"/>
    <path d="M518 197 C502 205 491 219 486 241" fill="none" stroke="#00b941" stroke-width="17" stroke-linecap="round"/>

    <path d="M359 198 H541 L526 257 H374 Z" fill="url(#laptop)" stroke="#00e84f" stroke-width="2.6"/>
    <path d="M374 257 H526 L545 266 H355 Z" fill="#11191b" stroke="#00a63b" stroke-width="2"/>
    <path d="M450 216 C437 216 429 224 429 234 C429 244 437 251 450 257 C463 251 471 244 471 234 C471 224 463 216 450 216 Z"
